versioning:
  scheme: unversioned action namespace
  notes: >-
    The Open API has no version segment, header or date-pinning: operations
    are flat Actions (e.g. DescribeUHostInstance) on a single gateway, and
    evolution happens by adding actions and parameters. First-party SDKs and
    the CLI carry their own semver release trains (see
    changelog/ucloud-changelog.yml).
