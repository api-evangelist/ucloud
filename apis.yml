aid: ucloud
name: UCloud
description: >-
  UCloud (优刻得, UCloud Technology Co., Ltd.) is a neutral Chinese cloud
  computing provider listed on the SSE STAR Market (688158), offering compute
  (UHost, bare-metal, GPU), object storage (UFile/US3), networking (VPC, ULB,
  EIP), Kubernetes (UK8S), databases, CDN, monitoring and AI infrastructure
  across China and 20+ global regions. Everything is managed through one
  Action-based Open API at api.ucloud.cn with signed requests, first-party
  SDKs in five languages, a CLI with an official published agent skill, and a
  Terraform provider. UCloud also runs an international arm at
  ucloud-global.com.
